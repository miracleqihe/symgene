name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    name: Commit identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/security/record-ci-evidence.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/security/ci-identity.json
          if-no-files-found: error
          retention-days: 14

  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce same-repository dev promotion when targeting main
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "main" ]]; then
            [[ "$HEAD_REF" == "dev" && "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]] || exit 1
          fi

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Configure bounded official Ubuntu package downloads
        timeout-minutes: 1
        shell: bash
        run: |
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test -f /etc/apt/apt-mirrors.txt
          # Preserve the runner's signed Ubuntu sources; replace only its slow mirror list.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'DPkg::Lock::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99symgene-ci-downloads
          apt-config dump | grep -F 'Acquire::Retries "2";'
          apt-config dump | grep -F 'Acquire::https::Timeout "20";'
      - name: Install locked Playwright Chromium and system dependencies
        timeout-minutes: 8
        run: npx --no-install playwright install --with-deps chromium
      - name: Install the Chinese font required by browser evidence
        timeout-minutes: 3
        run: sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Reproducible review at 390, 768, 1366 and 1920 pixels
        run: npm run review:browser
        env:
          REVIEW_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: content-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: work/review-evidence/
          if-no-files-found: error
          retention-days: 14

  content-integration:
    name: Content integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npm run check:legacy-content
      - run: node --test tests/storage.test.mjs tests/content-*.test.mjs
      - run: git diff --check

  gate:
    name: Engineering gate
    if: always()
    needs: [identity, branch-policy, verify, content-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Deliberately inline: the terminal decision does not import a PR script.
      # A changed PR workflow is still candidate CI, not production authority.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS_JSON)
            const expected = ['identity', 'branch-policy', 'verify', 'content-integration']
            if (expected.some(name => needs[name]?.result !== 'success')) {
              core.setFailed('Every required upstream job must finish with exactly success.')
            }
