name: T02 verification

# Ordinary PRs are covered by the unconditional CI Content integration job.
# This additional manual regression has no deployment authority or branch-name exception.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t02-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: T02 regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:content
      - run: npm run check:legacy-content
      - run: node --test tests/storage.test.mjs tests/content-*.test.mjs
      - run: git diff --check
