name: T02 verification

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [codex/t02-content-contract, codex/t02-m4-m5-gates, codex/t02-post-merge-fixes]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t02-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-content-integration:
    name: Content integration
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/t02-local-split-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:split
      - name: Storage v4, signed consumer, withdrawal and publication isolation
        run: node --test tests/storage.test.mjs tests/content-*.test.mjs
      - run: git diff --check

  t02-engineering:
    if: github.event_name != 'pull_request' || github.head_ref == 'codex/t02-content-contract' || github.head_ref == 'codex/t02-m4-m5-gates' || github.head_ref == 'codex/t02-post-merge-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: git diff --check
      - run: node scripts/t02/check-repository.mjs
