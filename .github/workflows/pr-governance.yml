name: PR governance

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion-pr-policy:
    name: Promotion PR policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # pull_request_target has a write-capable token. Never check out or run the
      # pull request head; the validator must come from the trusted base commit.
      - name: Check out trusted base policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Validate promotion metadata
        id: validate
        continue-on-error: true
        env:
          REPORT_PATH: ${{ runner.temp }}/promotion-pr-policy.md
        run: node .github/scripts/validate-promotion-pr.mjs

      - name: Comment on the pull request
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ runner.temp }}/promotion-pr-policy.md
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- symgene-promotion-pr-policy -->'
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8')
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100,
            })
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )

            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              })
            }

      - name: Enforce promotion policy
        if: steps.validate.outcome == 'failure'
        run: exit 1
